; ESP32-CYD (Cheap Yellow Display — 2432S028R) Real-Time CSI Radar Display
; Chip: original dual-core ESP32, CH340 USB-UART (/dev/ttyUSB0), 4MB flash
; Connects to the RuView sensing-server WebSocket and renders:
;   - 56-subcarrier amplitude bars (color-coded by level)
;   - Presence detection indicator
;   - Node ID, RSSI, channel
;   - Vitals: heart rate / breathing rate (when available)
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor

[env:esp32cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_port = /dev/ttyUSB0
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.4.1

; ── TFT_eSPI configuration for CYD 2432S028R ──────────────────────────────
; Display: ILI9341 2.8" 320x240 TFT (landscape via rotation=1)
; Touch:   XPT2046 (separate SPI bus — CS=33)
build_flags =
    ; Tell TFT_eSPI to use these defines instead of its own User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1

    ; TFT SPI pins (VSPI bus)
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1

    ; Backlight: GPIO21, active HIGH
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; SPI speeds
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; XPT2046 touch chip-select (shares VSPI bus)
    -DTOUCH_CS=33

    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1

    ; ── Application config ──────────────────────────────────────────────
    ; Override these with your WiFi and server details.
    ; For production builds use a secrets.h or build-time substitution.
    -DWIFI_SSID=\"herberts_hideout\"
    -DWIFI_PASS=\"tactic6-cob-awn\"
    -DSERVER_HOST=\"192.168.1.7\"
    -DSERVER_WS_PORT=3001
    ; WebSocket path on the sensing-server
    -DSERVER_WS_PATH=\"/\"
    ; Reconnect interval on WebSocket failure (ms)
    -DWS_RECONNECT_MS=5000
